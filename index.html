<title>懂了</title>
<meta name="description" content="用生活场景把技术黑话讲成人话,一屏一个词,答错不扣分。ADHD 友好。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root{
    --bg:#FAF5EE; --surface:#FFFFFF; --surface-2:#FBF3E9;
    --ink:#241C15; --muted:#7C6F60; --line:#EBDFCF;
    --accent:#E0592A; --accent-soft:#FBE5D8;
    --ok:#2E8B72; --ok-soft:#DBEFE7;
    --lock:#C9BCA9;
    --shadow:0 1px 0 rgba(36,28,21,.04), 0 10px 30px -14px rgba(36,28,21,.22);
    --r:22px;
    --display:"Fraunces", Georgia, "Songti SC", serif;
    --body:"Atkinson Hyperlegible", -apple-system, "PingFang SC", system-ui, sans-serif;
    color-scheme:light;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
    --bg:#17120D; --surface:#211A13; --surface-2:#2A2118;
    --ink:#F4ECE0; --muted:#B6A794; --line:#372C20;
    --accent:#FF7A47; --accent-soft:#3A2418;
    --ok:#4FBF9E; --ok-soft:#193029; --lock:#5A4C3C;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 14px 34px -16px rgba(0,0,0,.6);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#17120D; --surface:#211A13; --surface-2:#2A2118;
    --ink:#F4ECE0; --muted:#B6A794; --line:#372C20;
    --accent:#FF7A47; --accent-soft:#3A2418;
    --ok:#4FBF9E; --ok-soft:#193029; --lock:#5A4C3C;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 14px 34px -16px rgba(0,0,0,.6);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--body); line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:560px; margin:0 auto; min-height:100%;
    padding:16px 18px calc(20px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column;
  }
  .top{display:flex; align-items:center; gap:12px; padding:6px 2px 4px}
  .brand{font-family:var(--display); font-weight:600; font-size:22px; display:flex; align-items:center; gap:8px}
  .brand .logo{
    width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-size:15px;font-weight:700;
  }
  .icon-btn{
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    width:38px; height:38px; border-radius:12px; font-size:16px; cursor:pointer; line-height:1;
  }
  .icon-btn:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .theme-btn{margin-left:auto}

  /* ---------- HOME / MAP ---------- */
  .lede{color:var(--muted); font-size:15px; margin:10px 2px 4px}
  .stats{display:flex; gap:16px; align-items:center; margin:16px 2px 2px}
  .ring{position:relative; flex:0 0 84px; width:84px; height:84px}
  .ring svg{transform:rotate(-90deg)}
  .ring .num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1}
  .ring .num b{font-family:var(--display); font-size:22px}
  .ring .num span{font-size:11px; color:var(--muted)}
  .stat-meta{display:flex; flex-direction:column; gap:7px; min-width:0}
  .pill{display:inline-flex; gap:7px; align-items:center; background:var(--surface-2); border-radius:99px; padding:7px 13px; font-size:13.5px; font-weight:700; width:fit-content}
  .tiers{font-size:13px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap}
  .share-btn{background:transparent; color:var(--accent); border:1.5px solid var(--accent); border-radius:99px; padding:7px 14px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; width:fit-content; transition:transform .06s}
  .metabtns{display:flex; gap:8px; flex-wrap:wrap}
  .welcome{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:15px 18px; margin:16px 2px 2px; font-size:15.5px; box-shadow:var(--shadow)}
  .welcome b{font-family:var(--display); font-weight:600}
  .helper{margin:18px 0 4px; text-align:center; color:var(--muted); font-size:14px}
  .toast{position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:99px; font-size:14px; font-weight:700; z-index:60; box-shadow:var(--shadow); animation:toastin .25s}
  @keyframes toastin{from{opacity:0; transform:translate(-50%,8px)}to{opacity:1; transform:translate(-50%,0)}}
  .share-btn:active{transform:scale(.98)}
  .share-btn:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
  .sharecard{background:linear-gradient(150deg,var(--accent-soft),var(--surface-2)); border:1px solid var(--line); border-radius:18px; padding:24px 22px; text-align:center}
  .sharecard .logo{width:42px; height:42px; border-radius:12px; background:var(--accent); color:#fff; display:inline-grid; place-items:center; font-family:var(--display); font-weight:700; font-size:21px}
  .sharecard h3{font-family:var(--display); font-weight:600; font-size:21px; margin:12px 0 0}
  .sharecard .score{font-family:var(--display); font-size:46px; font-weight:600; color:var(--accent); line-height:1; margin:12px 0 4px}
  .sharecard .row{display:flex; justify-content:center; gap:14px; font-size:13.5px; color:var(--muted); flex-wrap:wrap; margin-top:8px}
  .allclear{background:var(--ok-soft); color:var(--ok); border-radius:14px; padding:13px 16px; font-weight:700; text-align:center; margin:14px 2px 0; animation:rise .4s}
  .reset-link{display:block; margin:14px auto 0; background:none; border:none; color:var(--muted); font:inherit; font-size:13px; text-decoration:underline; cursor:pointer}
  .reset-link:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .path{list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:12px}
  .lvl{
    display:flex; gap:14px; align-items:center; width:100%; text-align:left; cursor:pointer;
    background:var(--surface); border:1px solid var(--line); border-radius:18px;
    padding:16px; font:inherit; color:var(--ink); box-shadow:var(--shadow);
    transition:transform .06s, border-color .15s;
  }
  .lvl:hover:not([disabled]){border-color:var(--accent)}
  .lvl:active:not([disabled]){transform:scale(.99)}
  .lvl:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .lvl.locked{opacity:.62}
  .lvl.current{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft), var(--shadow)}
  .startchip{display:inline-block; margin-top:9px; background:var(--accent); color:#fff; font-size:12px; font-weight:700; padding:4px 12px; border-radius:99px}
  .lvl .badge{
    flex:0 0 52px; height:52px; border-radius:14px; background:var(--surface-2);
    display:grid; place-items:center; font-size:26px;
  }
  .lvl .meta{flex:1; min-width:0}
  .lvl .name{font-family:var(--display); font-weight:600; font-size:19px; margin:0}
  .lvl .sub{margin:2px 0 0; color:var(--muted); font-size:13.5px}
  .lvl .tag{
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:700;
    color:var(--accent); margin:0 0 3px;
  }
  .lvl .state{flex:0 0 auto; font-size:22px; color:var(--lock)}
  .lvl .state.done{color:var(--ok)}
  .lvl .state.open{color:var(--accent)}
  .minibar{display:flex; gap:4px; margin-top:8px}
  .minibar i{height:5px; flex:1; border-radius:99px; background:var(--line)}
  .minibar i.on{background:var(--ok)}

  /* ---------- DECK ---------- */
  .dots{display:flex; gap:8px; padding:6px 2px 16px}
  .dots i{flex:1; height:8px; border-radius:99px; background:var(--line); transition:background .35s}
  .dots i.done{background:var(--ok)} .dots i.here{background:var(--accent)}
  .back{
    background:transparent; border:none; color:var(--muted); font:inherit; font-size:14px;
    cursor:pointer; padding:6px 2px; display:inline-flex; align-items:center; gap:6px;
  }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    box-shadow:var(--shadow); padding:24px 22px 22px; flex:1;
    display:flex; flex-direction:column; animation:rise .4s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes rise{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
  .eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; margin:0 0 6px}
  .term{font-family:var(--display); font-weight:600; font-size:33px; line-height:1.1; margin:0; text-wrap:balance}
  .plain{font-size:18px; margin:14px 0 0}
  .analogy{background:var(--surface-2); border-radius:16px; padding:16px; margin:18px 0 0; display:flex; gap:14px; align-items:center}
  .analogy svg{flex:0 0 80px; width:80px; height:80px; background:var(--accent-soft); border-radius:16px; padding:10px}
  .analogy p{margin:0; font-size:15px; color:var(--muted)}
  .analogy b{color:var(--ink); font-weight:700}
  .q{margin:22px 0 10px; font-size:16px; font-weight:700}
  .opts{display:flex; flex-direction:column; gap:10px}
  .opt{
    text-align:left; font:inherit; font-size:16px; color:var(--ink); background:var(--surface);
    border:2px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer;
    transition:border-color .15s, background .15s, transform .06s;
  }
  .opt:hover:not([disabled]){border-color:var(--accent)}
  .opt:active:not([disabled]){transform:scale(.99)}
  .opt:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .opt[disabled]{cursor:default}
  .opt.correct{border-color:var(--ok); background:var(--ok-soft); animation:pop .4s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
  @keyframes popbig{0%{transform:scale(.2) rotate(-15deg); opacity:0}60%{transform:scale(1.2) rotate(6deg); opacity:1}100%{transform:scale(1) rotate(0)}}
  .dots i.done{animation:dotpop .4s cubic-bezier(.2,.8,.2,1)}
  @keyframes dotpop{0%{transform:scaleY(1)}50%{transform:scaleY(1.9)}100%{transform:scaleY(1)}}
  .opt.wrong{border-color:var(--accent); background:var(--accent-soft); animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .feedback{margin-top:16px; padding:14px 16px; border-radius:14px; font-size:15px; background:var(--ok-soft)}
  .feedback b{color:var(--ok)}
  .feedback.hint{background:var(--accent-soft)} .feedback.hint b{color:var(--accent)}
  .spacer{flex:1}
  .next{
    margin-top:18px; width:100%; border:none; border-radius:16px; cursor:pointer;
    background:var(--accent); color:#fff; font:inherit; font-weight:700; font-size:17px; padding:16px;
    transition:opacity .2s, transform .06s;
  }
  .next:active:not([disabled]){transform:scale(.99)}
  .next[disabled]{opacity:.35; cursor:default}
  .next:focus-visible{outline:3px solid var(--ink); outline-offset:2px}

  .done-card{text-align:center; align-items:center; justify-content:center}
  .done-card .big{font-size:56px; line-height:1; margin:0 0 6px; animation:popbig .6s cubic-bezier(.2,.8,.2,1)}
  .done-card h2{font-family:var(--display); font-weight:600; font-size:28px; margin:0 0 6px; text-wrap:balance}
  .done-card p{color:var(--muted); margin:0 0 20px}
  .recap{list-style:none; padding:0; margin:0 0 22px; width:100%; display:flex; flex-direction:column; gap:8px}
  .recap li{display:flex; gap:10px; align-items:center; text-align:left; background:var(--surface-2); border-radius:12px; padding:11px 14px; font-size:15px}
  .recap li b{font-family:var(--display); font-weight:600}
  .recap .tick{color:var(--ok); font-weight:700}
  .ghost{margin-top:10px; background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:16px; padding:14px; width:100%; font:inherit; cursor:pointer}
  .foot{text-align:center; color:var(--muted); font-size:12px; padding:16px 0 4px}
  .foot a{color:var(--accent); text-decoration:none; font-weight:700}
  .report{display:inline-block; align-self:flex-start; margin-top:14px; color:var(--muted); font-size:12.5px; text-decoration:none}
  .report:hover{color:var(--accent)}
  .report:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.92em; background:var(--surface-2); padding:1px 5px; border-radius:5px}

  /* search / dictionary */
  .search{position:relative; margin:14px 2px 0}
  .search .mag{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:15px}
  .search input{width:100%; font:inherit; font-size:16px; padding:13px 14px 13px 40px; border-radius:14px; border:1px solid var(--line); background:var(--surface); color:var(--ink)}
  .search input:focus-visible{outline:3px solid var(--accent); outline-offset:1px; border-color:var(--accent)}
  .results{list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:6px}
  .results button{width:100%; text-align:left; font:inherit; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 14px; cursor:pointer; color:var(--ink); display:flex; gap:10px; align-items:baseline}
  .results button:hover{border-color:var(--accent)}
  .results .rt{font-weight:700} .results .rp{color:var(--muted); font-size:13px; margin-left:auto}
  .empty{color:var(--muted); font-size:14px; padding:8px 4px}

  .sheet{position:fixed; inset:0; background:rgba(20,15,10,.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:18px; animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet .box{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:22px; max-width:500px; width:100%; box-shadow:var(--shadow); animation:rise .3s}
  .sheet .who{margin:16px 0 0; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:700}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <span class="brand"><span class="logo">懂</span>懂了</span>
    <button class="icon-btn theme-btn" id="theme" aria-label="切换深浅色">◐</button>
  </div>
  <div id="stage" aria-live="polite"></div>
  <p class="foot">技术黑话翻译器 · 样片 · 答错不扣分,想学就学 · <a href="https://github.com/CanCanHHHHH/dongle-tech-slang/issues/new?title=%E4%BD%93%E9%AA%8C%E5%8F%8D%E9%A6%88%20/%20%E5%BB%BA%E8%AE%AE" target="_blank" rel="noopener">💬 反馈</a></p>
</div>

<script>
const LEVELS = [
  {
    id:"restaurant", icon:"🍜", name:"餐厅关", tag:"Lv.1 认字",
    sub:"接口 · 请求 · 参数 · 字段 · 状态码",
    cards:[
      {term:"接口 (API)", plain:"帮你要东西的「中间人」。", art:"waiter",
       analogy:"你在餐厅不会冲进后厨炒菜,而是跟<b>服务员</b>说要什么,他去后厨拿。前端要数据,也不直接进后厨(数据库),而是找接口要。",
       q:"前端想拿「用户的订单」,它该找谁?", praise:"对!接口是拿数据唯一的窗口。",
       opts:[{t:"自己冲进数据库翻",ok:false,why:"那是越权,厨房会乱套 —— 数据只能通过接口这个窗口拿。"},{t:"找接口要",ok:true},{t:"直接问客人",ok:false,why:"客人不知道后厨的东西 —— 要数据得走接口。"}]},
      {term:"请求 / 响应", plain:"你问一句,它答一句。", art:"pingpong",
       analogy:"你说「来份番茄炒蛋」是<b>请求</b>,服务员端菜回来是<b>响应</b>。一来一回,凑成一次完整对话。",
       q:"App 刷新时一直转圈圈,最可能在等什么?", praise:"没错,转圈 = 请求已发、响应未到。",
       opts:[{t:"请求发出了,还没等到响应",ok:true},{t:"你还没点单",ok:false,why:"转圈说明请求已经发了 —— 是在等对方回话(响应)。"},{t:"手机没电了",ok:false,why:"没电就黑屏了 —— 转圈是在等响应。"}]},
      {term:"参数", plain:"提要求时带的「附加条件」。", art:"ticket",
       analogy:"点单时你会说「<b>不要辣、要大份</b>」—— 这些就是参数。同一道菜,参数不同,端上来就不同。",
       q:"「只看已完成的订单」这个筛选,技术上叫?", praise:"对!筛选、排序、页码,都是参数。",
       opts:[{t:"一个参数",ok:true},{t:"一个 Bug",ok:false,why:"筛选是你主动提的条件,是参数;Bug 是出错了。"},{t:"一道新菜",ok:false,why:"没做新功能,只是给请求加了个条件 —— 参数。"}]},
      {term:"字段", plain:"返回的数据里,「每一样东西」。", art:"plate",
       analogy:"端上来的番茄炒蛋里有番茄、蛋、葱花,每样就是一个<b>字段</b>。订单数据的字段就是:订单号、金额、状态、时间。",
       q:"页面要显示「下单时间」,但接口没返回它,这叫?", praise:"对!这时就跟后端说:请加一个字段。",
       opts:[{t:"缺一个字段",ok:true},{t:"缺一个服务员",ok:false,why:"人没少,是这盘数据里少了「时间」这一样 —— 缺字段。"},{t:"缺钱",ok:false,why:"跟钱无关 —— 是数据里少了一项,缺字段,得请后端加上。"}]},
      {term:"状态码", plain:"一个数字,告诉你「成没成、为啥没成」。", art:"codes",
       analogy:"服务员的回话:<b>200</b> 好嘞菜来了 / <b>401</b> 您还没点单(没登录) / <b>404</b> 没这道菜 / <b>500</b> 后厨这道菜搞砸了(服务器处理出错)。",
       q:"页面报「404」,最可能是?", praise:"对!404 = 找不到。记住 200/401/404/500 就够用了。",
       opts:[{t:"要的东西不存在(地址错/被删了)",ok:true},{t:"你没登录",ok:false,why:"没登录是 401。404 是「找不到这个东西」。"},{t:"服务器崩了",ok:false,why:"崩了是 500。404 是「没这道菜」。"}]},
    ]
  },
  {
    id:"library", icon:"📚", name:"图书馆关", tag:"Lv.1 认字",
    sub:"数据库 · 数据 · 增删改查 · 分页",
    cards:[
      {term:"数据库", plain:"存所有数据的「大书库」。", art:"stacks",
       analogy:"图书馆有个巨大的书库,所有书按规矩摆好、随时能取。数据库就是这个书库 —— 用户、订单、商品,全存在里面。",
       q:"「所有用户的信息」存在哪?", praise:"对!数据全部躺在数据库里。",
       opts:[{t:"数据库",ok:true},{t:"服务员脑子里",ok:false,why:"人会忘、会下班 —— 数据要存进数据库才可靠。"},{t:"你的手机里",ok:false,why:"手机只是看,数据本体在远处的数据库。"}]},
      {term:"数据", plain:"书库里的「每一本书」。", art:"book",
       analogy:"书库里一本本书,就是一条条<b>数据</b>。一个用户、一笔订单,都是一条数据。",
       q:"「新注册了一个用户」,数据库里发生了?", praise:"对!新增了一条数据。",
       opts:[{t:"多了一条数据",ok:true},{t:"少了一本书",ok:false,why:"是新增,不是减少 —— 多了一条数据。"},{t:"什么都没变",ok:false,why:"注册会写入一条新数据。"}]},
      {term:"增删改查 (CRUD)", plain:"对数据能做的四件事。", art:"crud",
       analogy:"在图书馆你能:<b>借新书进来(增)、下架旧书(删)、改登记信息(改)、找一本书(查)</b>。几乎所有功能拆到底就这四种。",
       q:"「用户修改收货地址」属于哪种?", praise:"对!改。90% 的功能逃不出这四个字。",
       opts:[{t:"改",ok:true},{t:"删",ok:false,why:"没删掉东西,是把旧地址改成新的 —— 改。"},{t:"查",ok:false,why:"不是看,是动手改内容 —— 改。"}]},

  logbook:`<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><rect x="26" y="20" width="48" height="60" rx="5"/><path d="M38 36h24M38 48h24M38 60h16"/><circle cx="32" cy="36" r="1.6" fill="currentColor" stroke="none" style="color:var(--ok)"/><circle cx="32" cy="48" r="1.6" fill="currentColor" stroke="none" style="color:var(--ok)"/></svg>`,
  indexcard:`<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><rect x="22" y="26" width="44" height="48" rx="5"/><path d="M32 40h24M32 52h16"/><circle cx="64" cy="62" r="12" style="color:var(--ok)"/><path d="M73 71l8 8" style="color:var(--ok)"/></svg>`,
  gauge:`<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" style="color:var(--accent)"><path d="M24 66a26 26 0 1 1 52 0"/><path d="M50 66l16-14" style="color:var(--ok)"/><circle cx="50" cy="66" r="4" fill="currentColor" stroke="none" style="color:var(--ok)"/></svg>`,
};

// ---------- progress (per-viewer convenience) ----------
function loadDone(){ try{ return JSON.parse(localStorage.getItem('dl-done')||'{}'); }catch(e){ return {}; } }
function saveDone(d){ try{ localStorage.setItem('dl-done', JSON.stringify(d)); }catch(e){} }
let doneMap = loadDone();
let streakDays = 0;

// term -> card lookup, and 错词本 (words answered wrong, cleared once mastered)
const TERM2CARD = {};
LEVELS.forEach(l=> l.cards.forEach(c=>{ TERM2CARD[c.term]=c; }));
function loadWrong(){ try{ return JSON.parse(localStorage.getItem('dl-wrong')||'[]'); }catch(e){ return []; } }
function saveWrong(a){ try{ localStorage.setItem('dl-wrong', JSON.stringify(a)); }catch(e){} }
let wrongList = loadWrong();
function addWrong(term){ if(!wrongList.includes(term)){ wrongList.push(term); saveWrong(wrongList); } }
function removeWrong(term){ const k=wrongList.indexOf(term); if(k>=0){ wrongList.splice(k,1); saveWrong(wrongList); } }
function shuffle(a){ a=a.slice(); for(let k=a.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [a[k],a[j]]=[a[j],a[k]]; } return a; }

// 反馈渠道:默认走 GitHub Issues(公开仓库,作者能在 Issues 看到全部反馈)。
// 日后若改用免登录表单(腾讯问卷 / Tally / Google 表单),把 FEEDBACK_FORM 换成表单链接即可,全站入口自动切换。
const FEEDBACK_FORM = '';
const REPO_URL = 'https://github.com/CanCanHHHHH/dongle-tech-slang';
function feedbackURL(term){
  if(FEEDBACK_FORM) return FEEDBACK_FORM;
  const title = term ? `类比反馈:${term}` : '体验反馈 / 建议';
  const body  = term ? `【词条】${term}\n\n【我觉得可以更好的地方】\n` : `【我的体验 / 建议】\n\n【哪里最卡壳,或最有帮助】\n`;
  return `${REPO_URL}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
}

function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// streak counts days the user actually LEARNED (completed >=1 card), not mere visits
function readStreak(){ try{ return (JSON.parse(localStorage.getItem('dl-streak'))||{}).streak||0; }catch(e){ return 0; } }
function recordLearningDay(){
  let s={last:null, streak:0};
  try{ s = JSON.parse(localStorage.getItem('dl-streak')) || s; }catch(e){}
  const t = ymd(new Date());
  const y = ymd(new Date(Date.now()-86400000));
  if(s.last===t){ /* already counted today */ }
  else if(s.last===y){ s.streak=(s.streak||0)+1; s.last=t; }
  else { s.streak=1; s.last=t; }
  try{ localStorage.setItem('dl-streak', JSON.stringify(s)); }catch(e){}
  streakDays = s.streak;
}

const stage = document.getElementById('stage');
let toastTimer, keyHandler;
function setKeys(fn){
  if(keyHandler) document.removeEventListener('keydown', keyHandler);
  keyHandler = fn || null;
  if(keyHandler) document.addEventListener('keydown', keyHandler);
}
function showToast(msg){
  document.querySelector('.toast')?.remove();
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.remove(), 1900);
}

function levelDoneCount(id){ return (doneMap[id]||[]).length; }
function isLevelDone(id, total){ return levelDoneCount(id) >= total; }
function isUnlocked(idx){ return idx===0 || isLevelDone(LEVELS[idx-1].id, LEVELS[idx-1].cards.length); }

// ---------- dictionary index ----------
const INDEX = [];
LEVELS.forEach((lv, li)=> lv.cards.forEach(c=> INDEX.push({term:c.term, plain:c.plain, card:c, li, name:lv.name, icon:lv.icon})));

function openLookup(e){
  const lv = LEVELS[e.li], unlocked = isUnlocked(e.li);
  const wrap = document.createElement('div'); wrap.className='sheet';
  wrap.innerHTML = `
    <div class="box">
      <div class="analogy" style="margin-top:0">${ART[e.card.art]||''}<p><b style="color:var(--ink);font-size:17px">${e.card.term}</b><br>${e.card.plain}</p></div>
      <p style="font-size:15px;margin:16px 0 0">${e.card.analogy}</p>
      <p class="who">${e.icon} ${e.name} · ${lv.tag}</p>
      <button class="next" id="goto" ${unlocked?'':'disabled'}>${unlocked?'去这一关学 →':'🔒 先解锁前面的关'}</button>
      <button class="ghost" id="close">关闭</button>
    </div>`;
  document.body.appendChild(wrap);
  const shut = ()=> wrap.remove();
  wrap.addEventListener('click', ev=>{ if(ev.target===wrap) shut(); });
  wrap.querySelector('#close').addEventListener('click', shut);
  if(unlocked) wrap.querySelector('#goto').addEventListener('click', ()=>{ shut(); renderDeck(e.li); });
}

function openShare(d){
  const wrap = document.createElement('div'); wrap.className='sheet';
  wrap.innerHTML = `
    <div class="box">
      <div class="sharecard">
        <span class="logo">懂</span>
        <h3>我的技术黑话进度</h3>
        <div class="score">${d.learned}<span style="font-size:20px;color:var(--muted)"> / ${d.total}</span></div>
        <div class="row"><span>🔥 连续 ${streakDays} 天</span>${(d.tiers||[]).map(s=>`<span>${s.label} ${s.d}/${s.t}</span>`).join('')}</div>
      </div>
      <button class="next" id="copy">复制战绩文字</button>
      <button class="ghost" id="close">截图上方卡片分享给朋友 · 关闭</button>
      <button class="reset-link" id="reset">重置我的进度</button>
    </div>`;
  document.body.appendChild(wrap);
  const shut = ()=> wrap.remove();
  wrap.addEventListener('click', ev=>{ if(ev.target===wrap) shut(); });
  wrap.querySelector('#close').addEventListener('click', shut);
  const rs = wrap.querySelector('#reset'); let armed=false;
  rs.addEventListener('click', ()=>{
    if(!armed){ armed=true; rs.textContent='确定清空全部进度?再点一次'; return; }
    doneMap={}; try{ localStorage.removeItem('dl-done'); }catch(e){}
    shut(); renderHome();
  });
  const cp = wrap.querySelector('#copy');
  cp.addEventListener('click', ()=>{
    const txt = `我在「懂了」学会了 ${d.learned}/${d.total} 个技术黑话 🎓\n🔥 连续 ${streakDays} 天 · ${(d.tiers||[]).map(s=>s.label+' '+s.d+'/'+s.t).join(' · ')}\n用生活场景听懂技术,答错不扣分~`;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(()=>{ cp.textContent='已复制 ✓'; }).catch(()=>{ cp.textContent='复制没成功,长按卡片截图吧'; });
    } else { cp.textContent='长按上方卡片截图分享吧'; }
  });
}

// ---------- HOME ----------
function renderHome(){
  setKeys(null);
  const totalWords = LEVELS.reduce((s,l)=>s+l.cards.length,0);
  const learned = LEVELS.reduce((s,l)=>s+levelDoneCount(l.id),0);
  const TIERS = [['🟢 Lv.1 认字','Lv.1'],['🟡 Lv.2 听得懂','Lv.2'],['🟠 Lv.3 说得清','Lv.3'],['🔴 Lv.4 聊得来','Lv.4']];
  const tierStats = TIERS.map(([label,key])=>{
    const ls = LEVELS.filter(l=>l.tag.includes(key));
    if(!ls.length) return null;
    return { label, d: ls.reduce((s,l)=>s+levelDoneCount(l.id),0), t: ls.reduce((s,l)=>s+l.cards.length,0) };
  }).filter(Boolean);
  const C = 2*Math.PI*36, off = C*(1 - (totalWords? learned/totalWords : 0));
  const statsHTML = `
    <div class="stats">
      <div class="ring">
        <svg width="84" height="84" viewBox="0 0 84 84">
          <circle cx="42" cy="42" r="36" fill="none" stroke="var(--line)" stroke-width="8"/>
          <circle cx="42" cy="42" r="36" fill="none" stroke="var(--ok)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
        </svg>
        <div class="num"><b>${learned}</b><span>/ ${totalWords}</span></div>
      </div>
      <div class="stat-meta">
        <span class="pill">🔥 连续学习 ${streakDays} 天</span>
        <div class="tiers">${tierStats.map(s=>`<span>${s.label} ${s.d}/${s.t}</span>`).join('')}</div>
        <div class="metabtns">
          <button class="share-btn" id="review">${(wrongList.filter(t=>TERM2CARD[t]).length)>0 ? `🔁 复习错词 (${wrongList.filter(t=>TERM2CARD[t]).length})` : '🔁 随机复习'}</button>
          <button class="share-btn" id="share">🏆 成绩卡</button>
        </div>
      </div>
    </div>`;
  const welcomeHTML = `<div class="welcome">👋 新手就从下面的 <b>🍜 餐厅关</b> 开始 —— 3 分钟,学会你的头 5 个词。</div>`;
  stage.innerHTML = `
    <p class="lede">开会听不懂技术黑话?这里用生活场景把它们讲成人话,让你跟程序员、产品能对上话。一屏一个词,答错不扣分。</p>
    ${learned===totalWords && totalWords>0 ? `<div class="allclear">🎉 全部通关!${totalWords} 个技术黑话你都拿下了</div>` : ''}
    ${learned>0 ? statsHTML : welcomeHTML}
    <div class="search"><span class="mag">🔍</span><input id="search" placeholder="随手查:输入一个词,如 接口 / Bug / 缓存" autocomplete="off" aria-label="查词"></div>
    <ul class="results" id="results"></ul>
    <ul class="path" id="path"></ul>`;
  const shareBtn = stage.querySelector('#share');
  if(shareBtn) shareBtn.addEventListener('click', ()=> openShare({learned, total:totalWords, tiers:tierStats}));
  const reviewBtn = stage.querySelector('#review');
  if(reviewBtn) reviewBtn.addEventListener('click', renderReview);
  const inp = stage.querySelector('#search'), res = stage.querySelector('#results');
  inp.addEventListener('input', ()=>{
    const q = inp.value.trim().toLowerCase();
    if(!q){ res.innerHTML=''; return; }
    const hits = INDEX.filter(e=> (e.term+e.plain).toLowerCase().includes(q)).slice(0,8);
    res.innerHTML = hits.length
      ? hits.map(e=>`<li><button data-i="${INDEX.indexOf(e)}"><span class="rt">${e.term}</span><span class="rp">${e.icon} ${e.name}</span></button></li>`).join('')
      : `<li class="empty">没找到「${inp.value.trim()}」,换个词试试</li>`;
  });
  res.addEventListener('click', ev=>{ const b=ev.target.closest('button[data-i]'); if(b) openLookup(INDEX[+b.dataset.i]); });
  const path = stage.querySelector('#path');
  const currentIdx = LEVELS.findIndex((l,ix)=> isUnlocked(ix) && !isLevelDone(l.id, l.cards.length));
  LEVELS.forEach((lv, idx)=>{
    const unlocked = isUnlocked(idx);
    const done = isLevelDone(lv.id, lv.cards.length);
    const dc = levelDoneCount(lv.id);
    const isCurrent = idx===currentIdx;
    const state = done ? '<span class="state done">✓</span>' : (unlocked ? '<span class="state open">→</span>' : '<span class="state">🔒</span>');
    const bars = lv.cards.map((_,n)=>`<i class="${n<dc?'on':''}"></i>`).join('');
    const btn = document.createElement('button');
    btn.className = (unlocked?'lvl':'lvl locked') + (isCurrent?' current':'');
    btn.innerHTML = `
      <span class="badge">${unlocked?lv.icon:'🔒'}</span>
      <span class="meta">
        <p class="tag">${lv.tag}${done?' · 已通关':(unlocked?'':' · 先过上一关')}</p>
        <p class="name">${lv.name}</p>
        <p class="sub">${lv.sub}</p>
        <span class="minibar">${bars}</span>
        ${isCurrent?`<span class="startchip">▶ ${dc>0?'继续':'开始'}</span>`:''}
      </span>
      ${state}`;
    btn.addEventListener('click', ()=> unlocked ? renderDeck(idx) : showToast(`先通关「${LEVELS[idx-1].name}」就解锁这一关 🔓`));
    path.appendChild(btn);
    if(isCurrent && currentIdx>2){ requestAnimationFrame(()=> btn.scrollIntoView({behavior:'smooth', block:'center'})); }
  });
}

// ---------- DECK ----------
function renderDeck(lvlIdx){
  const lv = LEVELS[lvlIdx];
  playSession({ cards: lv.cards, icon: lv.icon, name: lv.name, levelId: lv.id, lvlIdx });
}

function collectLearned(){
  const arr=[];
  LEVELS.forEach(l=> (doneMap[l.id]||[]).forEach(n=>{ if(l.cards[n]) arr.push(l.cards[n]); }));
  return arr;
}
function renderReview(){
  const wrongCards = shuffle(wrongList.map(t=>TERM2CARD[t]).filter(Boolean));
  const learned = shuffle(collectLearned());
  const pool=[]; const seen=new Set();
  for(const c of wrongCards){ if(!seen.has(c.term)){ pool.push(c); seen.add(c.term); } }        // 错词优先
  for(const c of learned){ if(pool.length>=10) break; if(!seen.has(c.term)){ pool.push(c); seen.add(c.term); } } // 其余随机补足
  if(pool.length===0){ showToast('先学几个词,再来复习吧 🙂'); return; }
  playSession({ cards: pool.slice(0,10), icon:'🔁', name: wrongCards.length ? '复习错词' : '随机复习', review:true });
}

// generic quiz engine for both learning a level and reviewing
function playSession(cfg){
  const cards = cfg.cards;
  const solved = new Array(cards.length).fill(false);
  if(!cfg.review){ (doneMap[cfg.levelId]||[]).forEach(n=>{ if(n<solved.length) solved[n]=true; }); }
  let i = solved.findIndex(s=>!s); if(i<0) i=0;
  let perfect = 0; // review: first-try correct count

  function markSolved(n){
    solved[n]=true;
    if(!cfg.review){
      const arr = new Set(doneMap[cfg.levelId]||[]); arr.add(n);
      doneMap[cfg.levelId]=[...arr]; saveDone(doneMap);
    }
    recordLearningDay();
  }
  function dotsHTML(){
    return `<div class="dots">${cards.map((_,n)=>`<i class="${solved[n]?'done':(n===i?'here':'')}"></i>`).join('')}</div>`;
  }
  function card(){
    const c = cards[i];
    let firstTry = true;
    stage.innerHTML = `
      <button class="back" id="back">← 关卡地图</button>
      ${dotsHTML()}
      <div class="card">
        <p class="eyebrow">${cfg.icon} ${cfg.name} · 第 ${i+1}/${cards.length} 词</p>
        <h1 class="term">${c.term}</h1>
        <p class="plain">${c.plain}</p>
        <div class="analogy">${ART[c.art]||''}<p>${c.analogy}</p></div>
        <p class="q">${c.q}</p>
        <div class="opts" id="opts">${c.opts.map((o,n)=>`<button class="opt" data-n="${n}">${o.t}</button>`).join('')}</div>
        <div id="fb"></div>
        <p class="helper" id="helper"${solved[i]&&!cfg.review?' hidden':''}>👆 选一个答案,答对就能继续</p>
        <div class="spacer"></div>
        <button class="next" id="next"${solved[i]&&!cfg.review?'':' hidden'}>${i===cards.length-1?'完成 🎉':'下一个 →'}</button>
        <a class="report" href="${feedbackURL(c.term)}" target="_blank" rel="noopener">🚩 这条讲错了?告诉作者</a>
      </div>`;
    stage.querySelector('#back').addEventListener('click', renderHome);
    const opts = stage.querySelector('#opts'), fb = stage.querySelector('#fb'), next = stage.querySelector('#next'), helper = stage.querySelector('#helper');
    setKeys(e=>{
      if(e.key>='1' && e.key<='9'){ const b=opts.children[+e.key-1]; if(b && !b.disabled){ e.preventDefault(); b.click(); } }
      else if(e.key==='Enter'){ if(next && !next.hidden){ e.preventDefault(); next.click(); } }
    });
    if(solved[i] && !cfg.review){ // already learned (level mode): reveal answer
      [...opts.children].forEach((b,n)=>{ b.disabled=true; if(c.opts[n].ok) b.classList.add('correct'); });
      fb.className='feedback'; fb.innerHTML=`<b>懂了 ✓</b> ${c.praise}`;
    }
    opts.addEventListener('click', e=>{
      const btn=e.target.closest('.opt'); if(!btn||btn.disabled) return;
      const o=c.opts[+btn.dataset.n];
      if(o.ok){
        btn.classList.add('correct'); [...opts.children].forEach(b=>b.disabled=true);
        fb.className='feedback'; fb.innerHTML=`<b>懂了 ✓</b> ${c.praise}`;
        if(cfg.review && firstTry) perfect++;
        if(firstTry) removeWrong(c.term); // 首答答对 = 掌握,移出错词本
        markSolved(i); helper.hidden=true; next.hidden=false; next.focus();
      }else{
        firstTry=false;
        addWrong(c.term); // 答错入错词本
        btn.classList.add('wrong'); btn.disabled=true;
        fb.className='feedback hint'; fb.innerHTML=`<b>再想想</b> ${o.why}`;
      }
    });
    next.addEventListener('click', ()=>{ i++; i<cards.length ? card() : finish(); });
  }
  function finish(){
    if(cfg.review){
      stage.innerHTML = `
        <div class="card done-card">
          <p class="big">💪</p>
          <h2>复习完成!又巩固了 ${cards.length} 个词</h2>
          <p>一次答对 ${perfect}/${cards.length} —— 记得越来越牢了。</p>
          <ul class="recap">${cards.map(c=>`<li><span class="tick">✓</span><span><b>${c.term}</b> · ${c.plain}</span></li>`).join('')}</ul>
          <button class="next" id="again">再来一组 🔁</button>
          <button class="ghost" id="home">回到关卡地图</button>
        </div>`;
      stage.querySelector('#again').addEventListener('click', renderReview);
      stage.querySelector('#home').addEventListener('click', renderHome);
      setKeys(e=>{ if(e.key==='Enter'){ e.preventDefault(); stage.querySelector('#again').click(); } });
      return;
    }
    const nextLv = LEVELS[cfg.lvlIdx+1];
    stage.innerHTML = `
      <div class="card done-card">
        <p class="big">🎉</p>
        <h2>${cfg.name}通关!你学会了 ${cards.length} 个词</h2>
        <p>下次听到它们,不慌。</p>
        <ul class="recap">${cards.map(c=>`<li><span class="tick">✓</span><span><b>${c.term}</b> · ${c.plain}</span></li>`).join('')}</ul>
        <button class="next" id="go">${nextLv?`解锁下一关:${nextLv.icon} ${nextLv.name} →`:'回到关卡地图'}</button>
        <button class="ghost" id="home">回到关卡地图</button>
      </div>`;
    stage.querySelector('#go').addEventListener('click', ()=> nextLv ? renderDeck(cfg.lvlIdx+1) : renderHome());
    stage.querySelector('#home').addEventListener('click', renderHome);
    setKeys(e=>{ if(e.key==='Enter'){ e.preventDefault(); stage.querySelector('#go').click(); } });
  }
  card();
}

// theme toggle
const root=document.documentElement;
try{ const s=localStorage.getItem('dl-theme'); if(s) root.setAttribute('data-theme',s); }catch(e){}
document.getElementById('theme').addEventListener('click', ()=>{
  const cur=root.getAttribute('data-theme');
  const isDark = cur==='dark' || (!cur && matchMedia('(prefers-color-scheme:dark)').matches);
  const nx = isDark?'light':'dark'; root.setAttribute('data-theme',nx);
  try{ localStorage.setItem('dl-theme',nx); }catch(e){}
});

streakDays = readStreak();
renderHome();
</script>
